<div class="container">
  <h2>Список рецептов</h2>

  <!-- Если рецепты загружаются -->
  <div *ngIf="loading" class="loading">Загрузка...</div>

  <!-- Если рецепты есть -->
  <div *ngIf="!loading && recipes.length > 0" class="recipe-list">
    <mat-card class="recipe-card" *ngFor="let recipe of recipes">
      <mat-card-title>{{ recipe.name }}</mat-card-title>
      <mat-card-subtitle>Создан: {{ recipe.createdAt | date:'mediumDate' }}</mat-card-subtitle>

      <!-- Отображение картинки, если она есть -->
      <img *ngIf="recipe.image" [src]="recipe.image" alt="{{ recipe.name }}" class="recipe-image">

      <mat-card-content>
        <p>{{ recipe.description }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button [routerLink]="['/recipes', recipe.id]">Просмотр</button>
        <button mat-button [routerLink]="['/recipes', recipe.id, 'edit']">Редактировать</button>
        <button mat-button (click)="deleteRecipe(recipe.id)">Удалить</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <!-- Если рецептов нет -->
  <div *ngIf="!loading && recipes.length === 0" class="empty-state">
    <p>Нет рецептов. Создайте свой первый рецепт!</p>
    <button mat-button routerLink="/recipes/new">Создать рецепт</button>
  </div>
</div>
